<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reflection planted · Darpan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><style>
:root{--ink:#18352b;--green:#168a69;--mint:#eaf8f2;--line:#dcefe6;--gold:#d4ad63}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 50% 65%,#d5f3e9 0,transparent 55%),linear-gradient(145deg,#f7fcf9,#e8f7f3)}.top{height:72px;padding:0 clamp(20px,6vw,90px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dcefe688;background:#ffffffa8;backdrop-filter:blur(14px)}.brand{letter-spacing:.18em;font-size:12px;font-weight:700}.back{border:1px solid var(--line);border-radius:99px;padding:10px 16px;text-decoration:none;color:var(--ink);font-size:12px;background:white}.content{min-height:calc(100vh - 72px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 22px 72px;text-align:center}.badge{border:1px solid #cfebde;background:#f8fffb;color:#40816a;border-radius:99px;padding:8px 14px;font-size:10px;letter-spacing:.12em}.content h1{max-width:780px;margin:22px auto 12px;font:500 clamp(42px,7vw,78px)/1.08 'Playfair Display',Georgia,serif;letter-spacing:-.04em}.subtitle{max-width:580px;color:#779087;font-size:15px;line-height:1.75}.flower{width:min(34vw,210px);min-width:148px;margin:12px auto 0;filter:drop-shadow(0 20px 22px #3d796135);animation:bloom 1.4s cubic-bezier(.2,.8,.2,1) both, float 5s 1.4s ease-in-out infinite}@keyframes bloom{from{opacity:0;transform:scale(.55) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes float{50%{translate:0 -9px}}.topic{margin-top:16px;color:#728b80;font-size:12px}.topic strong{color:#315c49}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}.action{border:1px solid #dbe9e1;border-radius:99px;padding:13px 19px;text-decoration:none;color:#315c49;background:#fff;font-weight:600;font-size:13px;box-shadow:0 8px 20px #34584610;transition:.2s}.action:hover{transform:translateY(-2px);box-shadow:0 12px 26px #3458461c}.action.primary{background:#13966d;color:white;border-color:#13966d}.saved-thought{max-width:600px;margin:24px auto 0;padding:15px 22px;border:1px solid #d5ecdf;border-radius:16px;background:#ffffffa8;font:italic 17px/1.55 'Playfair Display',Georgia,serif;color:#527365}.count{margin-top:26px;color:#728b80;font-size:11px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><header class="top"><span class="brand">DARPAN · A MOMENT KEPT</span><a class="back" href="/">← Sanctuary</a></header><main class="content"><span class="badge">✦ &nbsp; SANCTUARY COMPLETE</span><h1>Your reflection has<br>been planted.</h1><p class="subtitle">A thought you explored can become a small, steady part of your growth.</p><img class="flower" src="/static/lotus-3d.png" alt="A glowing lotus flower"><div class="topic" id="topic"></div><div class="saved-thought" id="thought" hidden></div><nav class="actions"><a class="action" href="/#reflect">＋ New Chat</a><a class="action" href="/">⌂ Sanctuary</a><a class="action primary" href="/static/growth-pond.html">✿ &nbsp; View in Growth Pond</a></nav><p class="count" id="count"></p></main><script>
(()=>{let items=[];try{items=JSON.parse(localStorage.getItem('darpan')||localStorage.getItem('viveka')||'[]')}catch{}const item=items[0];const params=new URLSearchParams(location.search);const wanted=params.get('id');const record=(wanted&&items.find(x=>x.id===wanted))||item;document.querySelector('#count').textContent=`${items.length} ${items.length===1?'reflection':'reflections'} in your pond`;if(record){document.querySelector('#topic').innerHTML=`Reflection topic: <strong>${String(record.topic||'A student reflection').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</strong> · ${new Date(record.date||Date.now()).toLocaleDateString('en-IN',{month:'long',day:'2-digit',year:'numeric'})}`;const thought=record.studentReflection||record.teaching||record.next;if(thought){const box=document.querySelector('#thought');box.hidden=false;box.textContent=thought}}else{document.querySelector('h1').innerHTML='Your growth is still<br>unfolding.';document.querySelector('.subtitle').textContent='Complete a conversation and save a reflection to plant your first flower.';document.querySelector('#topic').textContent='Your next saved session will bloom here.';document.querySelector('.actions .primary').textContent='✿  Visit the Growth Pond'}})();
</script></body></html>
